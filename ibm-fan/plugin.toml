id = "makefu/ibm-fan"
name = "IBM Fan Control"
version = "1.0.0"
plugin_api = 24
author = "makefu"
license = "MIT"
icon = "car-fan"
description = "ThinkPad fan speed + level control via /proc/acpi/ibm/fan"
tags = ["bar", "panel", "system", "hardware"]
dependencies = ["bash", "cat", "sudo", "chgrp", "chmod", "udevadm"]

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll-interval.label"
description_key = "settings.poll-interval.description"
default = 3
min = 1
max = 300
step = 1

[[setting]]
key = "thermal_zone"
type = "string"
label_key = "settings.thermal-zone.label"
description_key = "settings.thermal-zone.description"
default = "thermal_zone0"

[[setting]]
key = "show_rpm"
type = "bool"
label_key = "settings.show-rpm.label"
description_key = "settings.show-rpm.description"
default = true

[[widget]]
id = "bar"
entry = "widget.luau"

[[panel]]
id = "control"
entry = "panel.luau"
width = 300
height = 200
placement = "attached"
position = "auto"
dismiss_on_outside_click = true
# Anchor the panel under the bar widget it belongs to (host default: centred).
open_near_click = true

[[service]]
id = "service"
entry = "service.luau"
